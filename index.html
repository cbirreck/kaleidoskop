<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaleidoskop</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070c;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      #stage {
        display: block;
        border-radius: 50%;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 999px;
        background: rgb(0 0 0 / 0.55);
        color: #fff;
        font: 500 15px/1 system-ui, sans-serif;
        letter-spacing: 0.02em;
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: none;
      }
      #hud.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
