<!doctype html>
<html lang="de" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Ohne das bietet Edge "Diese Seite uebersetzen?" an: die Seite ist als deutsch
      ausgezeichnet, die Browsersprache ist eine andere. Auf einer Seite ganz ohne Text
      ist das Angebot sinnlos und im Kiosk steht es mitten im Bild.
      Gehoert ins Dokument und nicht nur in den Startbefehl, damit es auch dort gilt,
      wo die Seite nicht ueber unseren Kiosk geoeffnet wird (i-2, iPad).
    -->
    <meta name="google" content="notranslate" />
    <title>Kaleidoskop</title>
    <style>
      :root {
        --bg: #05070c;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        font: 500 15px/1 system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      /* --- Timerbalken: blass genug, dass er ihn nach zwei Minuten ignoriert. --- */
      #timerbar {
        position: fixed;
        inset: 0 auto auto 0;
        height: 3px;
        width: 100%;
        transform-origin: left;
        background: rgb(255 255 255 / 0.22);
        transform: scaleX(0);
        z-index: 40;
        pointer-events: none;
      }

      /* --- Screens --- */
      .screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 1;
        transition: opacity 0.35s;
      }
      .screen[hidden] {
        display: none;
      }

      /* --- Startseite: 8 runde Kacheln pro Seite, blaetterbar --- */
      #start {
        flex-direction: column;
        gap: clamp(10px, 2vh, 24px);
      }
      #start:not([hidden]) {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #startinner {
        display: flex;
        align-items: center;
        gap: clamp(8px, 1.5vw, 24px);
      }
      #tiles {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: clamp(12px, 2.5vw, 34px);
        padding: 12px;
        transition: opacity 0.22s;
      }
      #tiles.turning {
        opacity: 0;
      }

      /* Blaettern gehoert ihm, also Maus und gross. */
      .pagebtn {
        width: 74px;
        height: 74px;
        flex: none;
        border-radius: 50%;
        border: 3px solid rgb(255 255 255 / 0.4);
        background: rgb(12 16 26 / 0.7);
        color: #fff;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: transform 0.12s, background 0.12s, opacity 0.2s;
      }
      .pagebtn svg {
        width: 34px;
        height: 34px;
        fill: currentColor;
      }
      .pagebtn:hover {
        transform: scale(1.1);
        background: rgb(30 38 56 / 0.85);
      }
      .pagebtn:active {
        transform: scale(0.95);
      }
      .pagebtn[disabled] {
        opacity: 0.18;
        cursor: default;
        transform: none;
      }

      #dots {
        display: flex;
        gap: 12px;
      }
      #dots span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgb(255 255 255 / 0.25);
        transition: background 0.2s, transform 0.2s;
      }
      #dots span.active {
        background: rgb(255 255 255 / 0.85);
        transform: scale(1.25);
      }
      .tile {
        width: clamp(110px, 17vw, 220px);
        aspect-ratio: 1;
        border-radius: 50%;
        border: none;
        padding: 0;
        background: #0b0f18;
        cursor: pointer;
        overflow: hidden;
        transition: transform 0.18s ease-out, box-shadow 0.18s ease-out;
        box-shadow: 0 0 0 0 rgb(255 255 255 / 0);
      }
      .tile canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .tile:hover,
      .tile:focus-visible {
        transform: scale(1.06);
        box-shadow: 0 0 0 4px rgb(255 255 255 / 0.55);
        outline: none;
      }

      /* --- Kaleidoskop-Modus --- */
      #stage {
        display: block;
        border-radius: 50%;
      }
      /* Unten rechts statt mittig: in der Mitte haben die Knoepfe die Show ueberlagert. */
      #controls {
        position: fixed;
        right: clamp(16px, 3vw, 44px);
        bottom: clamp(16px, 3vh, 44px);
        display: flex;
        gap: 20px;
        z-index: 30;
      }
      .bigbtn {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        border: 3px solid rgb(255 255 255 / 0.55);
        background: rgb(12 16 26 / 0.72);
        color: #fff;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: transform 0.12s, background 0.12s;
      }
      .bigbtn:hover {
        transform: scale(1.08);
        background: rgb(30 38 56 / 0.85);
      }
      .bigbtn:active {
        transform: scale(0.96);
      }
      .bigbtn svg {
        width: 42px;
        height: 42px;
        fill: currentColor;
      }
      /* .bigbtn setzt display:grid -- ohne diese Zeile wuerde [hidden] nicht greifen. */
      .bigbtn[hidden] {
        display: none;
      }

      /* --- Endscreen: das Muster schlaeft, es ist nicht kaputt. --- */
      #endscreen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgb(3 5 12 / 0.82);
        z-index: 50;
        opacity: 0;
        transition: opacity 1.2s;
      }
      #endscreen[hidden] {
        display: none;
      }
      #endscreen.visible {
        opacity: 1;
      }
      #endscreen svg {
        width: min(38vmin, 260px);
        height: auto;
        fill: #f4e7b8;
        opacity: 0.85;
        animation: breathe 5s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.04);
          opacity: 0.95;
        }
      }

      /* --- HUD: nur fuer Papa, blendet von selbst wieder aus. --- */
      #hud {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 999px;
        background: rgb(0 0 0 / 0.55);
        color: #fff;
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: none;
        z-index: 60;
      }
      #hud.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="timerbar"></div>

    <section class="screen" id="start">
      <div id="startinner">
        <button class="pagebtn" id="page-prev" aria-label="Vorige Seite">
          <svg viewBox="0 0 24 24"><path d="M15.5 3.5L7 12l8.5 8.5 2.1-2.1L11.2 12l6.4-6.4z" /></svg>
        </button>
        <div id="tiles"></div>
        <button class="pagebtn" id="page-next" aria-label="Naechste Seite">
          <svg viewBox="0 0 24 24"><path d="M8.5 3.5L17 12l-8.5 8.5-2.1-2.1L12.8 12 6.4 5.6z" /></svg>
        </button>
      </div>
      <div id="dots"></div>
    </section>

    <section class="screen" id="viewer" hidden>
      <canvas id="stage"></canvas>
      <div id="controls">
        <button class="bigbtn" id="btn-back" aria-label="Zurueck zur Auswahl">
          <svg viewBox="0 0 24 24"><path d="M3 5h8v6H3zm10 0h8v6h-8zM3 13h8v6H3zm10 0h8v6h-8z" /></svg>
        </button>
        <button class="bigbtn" id="btn-play" aria-label="Pause oder weiter">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z" /></svg>
        </button>
        <!-- Nur in Pause sichtbar: im Lauf gaebe es kein stehendes Bild zum Mitnehmen. -->
        <button class="bigbtn" id="btn-snap" aria-label="Bild speichern" hidden>
          <svg viewBox="0 0 24 24">
            <path
              d="M9 2L7.6 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2h-3.6L15 2H9zm3 5.2a5.8 5.8 0 110 11.6 5.8 5.8 0 010-11.6zm0 2.4a3.4 3.4 0 100 6.8 3.4 3.4 0 000-6.8z"
            />
          </svg>
        </button>
      </div>
    </section>

    <div id="endscreen" hidden>
      <svg viewBox="0 0 100 100">
        <path d="M63 8a42 42 0 1 0 29 71A46 46 0 0 1 63 8z" />
        <circle cx="30" cy="22" r="3" />
        <circle cx="20" cy="36" r="2" />
        <circle cx="38" cy="12" r="2" />
      </svg>
    </div>

    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
